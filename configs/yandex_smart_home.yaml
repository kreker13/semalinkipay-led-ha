# ============================================================
#  yandex_smart_home.yaml — что уходит в Яндекс (умный дом Yandex/Alice)
#  Отдаём РОВНО две template-прокладки. Физические *_phys НЕ отдаём — иначе
#  в Яндексе появятся «мёртвые» дубли, по которым Alice не попадёт.
#  ВАЖНО: entity_id ниже не менять после первой привязки к Яндексу.
# ============================================================
filter:
  include_entities:
    - light.neon
    - light.led

entity_config:
  light.neon:
    name: "Неоновая лента"     # как Alice будет называть (#1)
    slow: true
  light.led:
    name: "Светодиодная лента" # как Alice будет называть (#2)
    slow: true
